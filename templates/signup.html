{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="{% static 'signup.css' %}">
</head>
<body>
    <div class="container">
        <h3>Signup</h3>
        <form action="/signup" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" name="fname" id="fname" placeholder="Enter your first name" required>
            </div>
            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" name="lname" id="lname" placeholder="Enter your last name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="pass1">Password</label>
                <input type="password" name="pass1" id="pass1" placeholder="Enter password" required>
            </div>
            <div class="form-group">
                <label for="pass2">Confirm Password</label>
                <input type="password" name="pass2" id="pass2" placeholder="Confirm password" required>
                {% if messages %}
                    {% with error_displayed=False %}
                        {% for message in messages %}
                            {% if message.tags == 'error' and not error_displayed %}
                                <div class="error-message">{{ message }}</div>
                                {% with error_displayed=True %}
                                {%endwith%}
                            {% endif %}
                        {% endfor %}
                    {% endwith %}
                {% endif %}
            </div>
            <button type="submit">Signup</button>
        </form>
    </div>
</body>
</html>
